<style>
:root{--bg:#0e1116;--panel:#161b22;--panel2:#1d242e;--ink:#e7edf3;--mut:#8b98a7;--line:#2a333f;
--ok:#37d67a;--bad:#ff5d6c;--acc:#5aa9ff;--warn:#1a1204}
*{box-sizing:border-box}
body{margin:0;font:15px/1.55 system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
background:radial-gradient(1200px 700px at 60% -15%,#16202c,transparent),var(--bg);color:var(--ink);min-height:100vh}
.wrap{max-width:880px;margin:0 auto;padding:18px 16px 90px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.brand{font-weight:700}.brand small{color:var(--mut);font-weight:500;display:block;font-size:12px}
.nav{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--ink);
padding:9px 13px;border-radius:10px;transition:.15s}
button:hover{border-color:#3a4654}
button.primary{background:var(--acc);border-color:var(--acc);color:#04121f;font-weight:700}
button.primary:hover{filter:brightness(1.08)}
button.on{background:var(--warn);border-color:var(--warn);color:#1a1204;font-weight:700}
button:disabled{opacity:.4;cursor:default}
.view{display:none}.view.active{display:block}
/* home */
.hero{padding:14px 0 6px}
.hero h1{font-size:26px;margin:0 0 6px}.hero p{color:var(--mut);margin:0 0 22px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:600px){.tiles{grid-template-columns:1fr}}
.tile{display:block;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;transition:.15s}
.tile:hover{border-color:#3a4654;transform:translateY(-2px)}
.tile .ic{font-size:30px;margin-bottom:12px}.tile h2{margin:0 0 6px;font-size:19px}.tile p{margin:0;color:var(--mut);font-size:14px}
.tile .tag{display:inline-block;margin-top:14px;font-size:12px;font-weight:700;letter-spacing:.05em;padding:4px 10px;border-radius:999px}
.tag.quiz{background:rgba(90,169,255,.15);color:var(--acc)}.tag.study{background:rgba(55,214,122,.15);color:var(--ok)}
/* quiz */
.counter{color:var(--mut);font-size:13px;margin-bottom:8px;display:flex;justify-content:space-between}
.bar{height:6px;border-radius:6px;background:var(--panel2);overflow:hidden;margin:0 0 18px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),#7fd0ff);width:0;transition:.25s}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px}
.topic{color:var(--acc);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px}
.q{font-size:18px;line-height:1.6;font-weight:500;margin:0 0 18px}
.opts{display:flex;flex-direction:column;gap:10px}

.opt .t{flex:1 1 auto}
.opt:hover{border-color:#3a4654}
.opt.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.opt.correct{border-color:var(--ok);background:rgba(55,214,122,.10)}.opt.correct .k{background:var(--ok);color:#04140b}
.opt.wrong{border-color:var(--bad);background:rgba(255,93,108,.10)}.opt.wrong .k{background:var(--bad);color:#1a0508}
.opt.dim{opacity:.55}
.reveal-row{display:flex;align-items:center;gap:12px;margin-top:18px;flex-wrap:wrap}
.answer{font-weight:800;font-size:15px}.answer b{color:var(--ok)}
.badge{font-size:12px;padding:4px 9px;border-radius:999px;border:1px solid var(--line);color:var(--mut)}

.panel{margin-top:16px;border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--panel2)}
.panel h4{margin:0 0 8px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--warn)}
.note{border-left:3px solid var(--line);padding:6px 12px;margin:8px 0;color:#c4ccd6}
.note .meta{color:var(--mut);font-size:12px;margin-bottom:3px}
.note.picked-ok{border-left-color:var(--ok)}.note.picked-bad{border-left-color:var(--bad)}
.navrow{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:10px}
.hint{color:var(--mut);font-size:12px;text-align:center;margin-top:16px}
kbd{background:#232c37;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;font-size:11px}
/* study */
.controls{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 16px}
input{font:inherit;background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:9px 12px;min-width:200px}
.count{color:var(--mut);font-size:13px;margin-bottom:12px}
.item{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:0 0 14px}
.item .no{color:var(--ok);font-weight:800;font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px;display:flex;gap:8px;align-items:center}
.item .no .flag{color:var(--warn);border:1px solid var(--warn);border-radius:999px;padding:1px 8px;font-size:11px}
.item .q{font-size:16.5px;margin:0 0 12px}
.ans{border-left:3px solid var(--ok);background:rgba(55,214,122,.08);border-radius:8px;padding:10px 14px}
.hidden{display:none}

<script>
const CARDS=JSON.parse(document.getElementById('data').textContent);
const LETTERS=['A','B','C','D'];
const esc=s=>(s||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
const clean=s=>(s||'').replace(/\s+/g,' ').trim();
const $=id=>document.getElementById(id);

/* ---------- view switching ---------- */
function showView(v){
  document.querySelectorAll('.view').forEach(s=>s.classList.remove('active'));
  $('v-'+v).classList.add('active');
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.view===v));
  if(v==='quiz'&&!qzInit){qzInit=true;qzRender();}
  if(v==='study'&&!stInit){stInit=true;stRender();}
  window.scrollTo({top:0});
}
let qzInit=false, stInit=false;
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>showView(b.dataset.view));
document.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>showView(b.dataset.goto));

/* ---------- QUIZ ---------- */
let qzOrder=CARDS.map((_,i)=>i), qzPos=0, qzRevealed=false, qzSel=null, qzContested=false;
function qzCurrent(){return CARDS[qzOrder[qzPos]];}
function qzRender(){
  const c=qzCurrent(); qzRevealed=false; qzSel=null;
  $('qz-pos').textContent=`Q ${c.n} / ${CARDS.length}`;
  $('qz-fill').style.width=((qzPos+1)/CARDS.length*100)+'%';
  $('qz-reveal').disabled=false; $('qz-reveal').textContent='Reveal answer';
  let opts='';
  for(const L of LETTERS){ if(!c.choices[L])continue;
    opts+=`<button class="opt" data-k="${L}"><span class="k">${L}</span><span class="t">${esc(c.choices[L])}</span></button>`; }
  $('qz-card').innerHTML=`
    <div class="topic">Question ${c.n}${c.contested?' · ⚠ contested':''}</div>
    <p class="q">${esc(c.q)}</p>
    <div class="opts" id="qz-opts">${opts}</div>
    <div class="reveal-row hidden" id="qz-rr"><span class="answer">Correct: <b id="qz-ans"></b></span>
      <span class="badge" id="qz-conf"></span><span class="badge" id="qz-votes"></span></div>
    <div class="panel hidden" id="qz-cp"></div>`;
  $('qz-card').querySelectorAll('.opt').forEach(b=>b.onclick=()=>qzSelect(b.dataset.k));
  qzScore();
}
function qzSelect(k){ if(qzRevealed)return; qzSel=k;
  $('qz-card').querySelectorAll('.opt').forEach(b=>b.classList.toggle('sel',b.dataset.k===k));
  $('qz-reveal').textContent='Check answer'; }
function qzReveal(){
  if(qzRevealed)return; const c=qzCurrent(); qzRevealed=true; const correct=c.answer;
  $('qz-card').querySelectorAll('.opt').forEach(b=>{const k=b.dataset.k;
    if(k===correct)b.classList.add('correct'); else if(k===qzSel)b.classList.add('wrong'); else b.classList.add('dim');});
  $('qz-rr').classList.remove('hidden'); $('qz-ans').textContent=correct;
  const conf=$('qz-conf'); conf.textContent='confidence: '+(c.confidence||'?'); conf.className='badge '+(c.confidence==='high'?'ok':'warn');
  $('qz-votes').textContent=(c.votes||0)+' community vote'+((c.votes||0)===1?'':'s');
  if(c.contested){ const cp=$('qz-cp'); cp.classList.remove('hidden');
    let h=`<h4>⚠ Contested answer — take with a grain of salt</h4>
      <div class="note"><div class="meta">suggested ${esc(c.answer)} · community ${esc(c.community||'?')} · verified ${esc(c.verified||'?')} · most-voted ${esc(c.most_voted||'?')}</div>
      Low-count community opinions below are not authoritative.</div>`;
    (c.notes||[]).forEach(n=>{const ok=n.picked===c.answer;
      h+=`<div class="note ${ok?'picked-ok':'picked-bad'}"><div class="meta">${esc(n.user||'anon')} · picked ${esc(n.picked||'?')} · ${n.upvotes||0} upvote${(n.upvotes||0)===1?'':'s'}</div>${esc(n.text)}</div>`;});
    cp.innerHTML=h; }
  qzScore(); $('qz-next').focus();
}
function qzScore(){ const c=qzCurrent(); if(!qzRevealed){$('qz-score').textContent='';return;}
  const ok=qzSel===c.answer; $('qz-score').textContent=qzSel==null?'':(ok?'✓ correct':'✗ your pick: '+qzSel);
  $('qz-score').style.color=ok?'var(--ok)':'var(--bad)'; }
function qzGo(d){ qzPos=Math.max(0,Math.min(qzOrder.length-1,qzPos+d)); qzRender(); window.scrollTo({top:0,behavior:'smooth'}); }
function qzShuffle(){ qzOrder=CARDS.map((_,i)=>i);
  for(let i=qzOrder.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[qzOrder[i],qzOrder[j]]=[qzOrder[j],qzOrder[i]];}
  qzPos=0; qzRender(); }
function qzContestedToggle(){ qzContested=!qzContested; $('qz-contested').classList.toggle('on',qzContested);
  qzOrder = qzContested ? CARDS.map((c,i)=>i).filter(i=>CARDS[i].contested) : CARDS.map((_,i)=>i);
  qzPos=0; qzRender(); }
$('qz-reveal').onclick=qzReveal; $('qz-next').onclick=()=>qzGo(1); $('qz-prev').onclick=()=>qzGo(-1);
$('qz-shuffle').onclick=qzShuffle; $('qz-contested').onclick=qzContestedToggle;

/* ---------- STUDY ---------- */
let stOrder=CARDS.map((_,i)=>i), stContested=false;
function stRender(){
  const q=($('st-search').value||'').trim().toLowerCase();
  const rows=stOrder.map(i=>CARDS[i]).filter(c=>(!stContested||c.contested)&&(!q||c.q.toLowerCase().includes(q)));
  $('st-count').textContent=`Showing ${rows.length} of ${CARDS.length}`;
  $('st-list').innerHTML=rows.map(c=>`
    <div class="item"><div class="no">Question ${c.n}${c.contested?' <span class="flag">⚠ contested</span>':''}</div>
      <p class="q">${esc(c.q)}</p>
      <div class="ans"><div class="txt">${esc(c.choices[c.answer]||'')}</div></div></div>`).join('')||'<div class="count">No matches.</div>';
}
function stShuffle(){ for(let i=stOrder.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[stOrder[i],stOrder[j]]=[stOrder[j],stOrder[i]];} stRender(); }
$('st-search').addEventListener('input',stRender);
$('st-shuffle').onclick=stShuffle;
$('st-contested').onclick=e=>{stContested=!stContested;e.target.classList.toggle('on',stContested);stRender();};

/* ---------- keyboard (quiz only) ---------- */
document.addEventListener('keydown',e=>{
  if(!$('v-quiz').classList.contains('active'))return;
  if(e.target.tagName==='INPUT')return;
  const k=e.key.toLowerCase();
  if(['a','b','c','d'].includes(k)&&k.length===1){qzSelect(k.toUpperCase());}
  else if(e.key==='Enter'||e.key===' '){e.preventDefault(); if(!qzRevealed)qzReveal(); else qzGo(1);}
  else if(e.key==='ArrowRight'){qzGo(1);} else if(e.key==='ArrowLeft'){qzGo(-1);}
});
</script></div></body></html>
