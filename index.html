<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flashcards">
<meta name="theme-color" content="#0e1116">
<meta name="app-version" content="v2026-11-19e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Cert Flashcards</title>
<style>
:root{--bg:#0e1116;--panel:#161b22;--panel2:#1d242e;--ink:#e7edf3;--mut:#8b98a7;--line:#2a333f;
--ok:#37d67a;--acc:#5aa9ff;--warn:#e8a93c}
*{box-sizing:border-box}
body{margin:0;font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
background:radial-gradient(1200px 700px at 50% -15%,#16202c,transparent),var(--bg);color:var(--ink);min-height:100vh;
-webkit-text-size-adjust:100%}
.wrap{max-width:860px;margin:0 auto;
padding:calc(14px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left))}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.brand{font-weight:700;font-size:15px;min-width:0}
.brand small{color:var(--mut);font-weight:500;display:block;font-size:12px;overflow:hidden;text-overflow:ellipsis}
.brand button{margin-right:8px;padding:4px 10px;font-size:13px;flex:0 0 auto}
button,input,select{font:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--ink);
padding:10px 14px;border-radius:12px;transition:.15s;min-height:44px}
button:hover{border-color:#3a4654}
button:disabled{opacity:.45;cursor:not-allowed}
button:disabled:hover{border-color:var(--line)}
button.primary{background:var(--acc);border-color:var(--acc);color:#04121f;font-weight:700}
button.primary.revealed{background:var(--panel2);border-color:var(--line);color:var(--ink);font-weight:500}
button.on{background:#2a2110;border-color:var(--warn);color:var(--warn);font-weight:700}
.counter{color:var(--mut);font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.pillrow{display:flex;gap:8px}
#f-shuffle,#f-auto{min-height:44px;padding:6px 16px;font-size:13px;border-radius:999px}
.bar{height:5px;border-radius:5px;background:var(--panel2);overflow:hidden;margin:0 0 14px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),#7fd0ff);width:0;transition:.25s}
/* exam picker */
.tiles{display:grid;grid-template-columns:1fr;gap:12px;margin-top:8px}
.tile{display:block;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;transition:.15s;color:var(--ink);width:100%}
.tile:active{transform:scale(.99)}
.tile h2{margin:6px 0 6px;font-size:18px}
.tile p{margin:0;color:var(--mut);font-size:14px}
.tile .code{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--acc);
background:rgba(90,169,255,.12);border-radius:999px;padding:3px 10px}
.io{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;justify-content:center}
/* card */
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:12px}
.badge{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
color:var(--acc);background:rgba(90,169,255,.12);border-radius:999px;padding:3px 10px}
.badge.warnb{color:var(--warn);background:rgba(232,169,60,.12)}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.qnum{color:var(--mut);font-size:12px;margin-top:6px}
.q{font-size:17px;line-height:1.6;margin:12px 0 0;font-weight:500;overflow-wrap:break-word}
.q p{margin:0 0 10px;white-space:pre-line}
.q p:last-child{margin-bottom:0}
.q img{display:block;max-width:100%;height:auto;margin:10px 0;border-radius:8px;border:1px solid var(--line)}
.imgfallback{display:block;margin:8px 0;color:var(--mut);font-size:13px}
.ctx{margin-top:12px;font-size:13px}
.ctx summary{cursor:pointer;color:var(--acc);font-weight:600;padding:8px 0}
.ctx-body{border-left:3px solid var(--line);padding:10px 16px;line-height:1.65}
.ctx-body .hl{font-weight:700;color:var(--ink);margin:16px 0 5px;font-size:13.5px}
.ctx-body .hl:first-child{margin-top:0}
.ctx-body .ln{margin:6px 0;color:var(--mut)}
.opts{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.opt{display:flex;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left;width:100%;color:var(--ink)}
.opt .k{flex:0 0 auto;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-weight:800;background:#2b3542;color:#cdd7e2;font-size:13px}
.opt .t{flex:1;min-width:0;overflow-wrap:break-word;white-space:pre-line}
.opt.correct{border-color:var(--ok);background:rgba(55,214,122,.10)}
.opt.correct .k{background:var(--ok);color:#04140b}
.opt.hidden-opt{display:none}
.ansline{margin-top:14px;font-weight:800;color:var(--ok);display:none}
.ansline.show{display:block}
.exp{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:14px;line-height:1.65;color:var(--mut)}
.exp p{margin:0 0 10px}
.exp p:last-child{margin-bottom:0}
.exp strong{color:var(--ink)}
.exp a{color:var(--acc)}
.exp img{display:block;max-width:100%;height:auto;margin:10px 0;border-radius:8px}
.ansimg{display:none;margin-top:12px}
.ansimg.show{display:block}
.ansimg img{max-width:100%;border-radius:8px}
.actions{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.actions .primary{width:100%}
.nav{display:flex;gap:8px}
.nav button{flex:1}
.hint{color:var(--mut);font-size:12px;text-align:center;margin-top:12px;line-height:1.7}
@media(hover:none) and (pointer:coarse){.kbd-hint{display:none}}
kbd{background:#232c37;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;font-size:11px}
.hidden{display:none}
.empty{color:var(--mut);text-align:center;padding:32px 0}
/* responsive: purely width-driven so the layout adapts automatically to any device and orientation */
@media(min-width:600px){
  /* phones in landscape + tablets in portrait: exam tiles 2-across */
  .tiles{grid-template-columns:1fr 1fr}
}
@media(min-width:980px){
  /* tablets in landscape + desktop: tiles 3-across; study = card + sticky action rail */
  .tiles{grid-template-columns:repeat(3,1fr)}
  .wrap{max-width:1040px}
  .q{font-size:18px}
  #v-study:not(.hidden){display:grid;grid-template-columns:minmax(0,1fr) 230px;column-gap:20px;align-items:start;
  grid-template-areas:"counter rail" "bar rail" "card rail" "hint hint"}
  #v-study .counter{grid-area:counter}
  #v-study .bar{grid-area:bar}
  #v-study .card{grid-area:card;margin-bottom:0}
  #v-study .actions{grid-area:rail;position:sticky;top:calc(16px + env(safe-area-inset-top));margin-bottom:0}
  #v-study .hint{grid-area:hint}
}
@media(max-width:600px){
  .q{font-size:16px}
}
</style>
</head>
<body><div class="wrap">

<div class="top">
  <div class="brand"><button id="home" class="hidden">&larr; Exams</button><span id="brand-name">Cert Flashcards</span><small id="brand-sub">select an exam</small></div>
</div>

<!-- EXAM PICKER -->
<div id="v-exams">
  <div class="tiles" id="exam-tiles"></div>
  <div class="io">
    <button id="io-export">Export progress</button>
    <button id="io-import">Import progress</button>
    <input type="file" id="io-file" accept="application/json" class="hidden">
  </div>
  <p class="hint">Unofficial community question sets — answer keys are best-effort, verify against official docs.</p>
</div>

<!-- STUDY -->
<div id="v-study" class="hidden">
  <div class="counter"><span id="pos"></span><span class="pillrow"><button id="f-auto">Answers</button><button id="f-shuffle">Shuffle</button></span></div>
  <div class="bar"><i id="bar"></i></div>

  <div class="card">
    <div class="badges">
      <span class="badge" id="fc-domain"></span>
      <span class="badge warnb hidden" id="fc-visual">visual question</span>
    </div>
    <div class="qnum" id="fc-num"></div>
    <details class="ctx hidden" id="fc-ctx"><summary>Case study context</summary><div class="ctx-body" id="fc-ctx-body"></div></details>
    <p class="q" id="fc-q"></p>
    <div class="opts" id="fc-opts"></div>
    <div class="ansimg" id="fc-ansimg"></div>
    <div class="ansline" id="fc-ans"></div>
    <div class="exp hidden" id="fc-exp"></div>
  </div>

  <div class="actions">
    <button class="primary" id="fc-show">Show answer</button>
    <div class="nav">
      <button id="fc-prev">&larr; Prev</button>
      <button id="fc-next">Next &rarr;</button>
    </div>
  </div>

  <div class="hint kbd-hint"><kbd>space</kbd> show answer · <kbd>&larr;</kbd><kbd>&rarr;</kbd> navigate</div>
</div>

</div>
<script src="data-ccaf.js?v=20261112a"></script>
<script src="data-ai500.js?v=20261112a"></script>
<script src="data-cisdf.js?v=20261112a"></script>
  <script src="data-ai103.js?v=20261119a"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const REG=window.EXAM_DATA||{};
const IMG_FALLBACK='Image unavailable. It may be offline or blocked by the source.';
// Source dumps contain literal "\ \ " line-break artifacts; normalize them to paragraph breaks.
function cleanText(t){return String(t||'').replace(/\s*\\\s*\\\s*/g,'\n\n').trim()}
// Explanations are Markdown-ish: **bold** and [label](https://...) links.
function formatExp(text){
  let s=esc(cleanText(text));
  s=s.replace(/!\[([^\]]*)\]\((https?:\/\/[^)\s]+)\)/g,'<img src="$2" alt="$1" loading="lazy" decoding="async">');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  return s.split(/\n{2,}/).map(p=>'<p>'+p.replace(/\n/g,'<br>')+'</p>').join('');
}
function addImageFallback(el,msg){
  const fallback=()=>{
    const note=document.createElement('span');
    note.className='imgfallback';
    note.textContent=msg||'Image unavailable.';
    if(el.parentNode)el.replaceWith(note);
  };
  if(el.complete&&el.naturalWidth===0)fallback();
  else el.addEventListener('error',fallback,{once:true});
}
// Render plain text with line breaks plus any ![alt](https://...) question images.
function renderQuestion(el,text,n){
  el.textContent='';
  const t=cleanText(text);
  t.split(/\n{2,}/).map(s=>s.trim()).filter(Boolean).forEach(block=>{
    const p=document.createElement('p');
    let last=0;
    for(const m of block.matchAll(/!\[([^\]]*)\]\((https?:\/\/[^)\s]+)\)/g)){
      if(m.index>last)p.appendChild(document.createTextNode(block.slice(last,m.index)));
      const img=document.createElement('img');
      img.src=m[2];
      img.alt=m[1]||('Question image for question '+n);
      img.loading='lazy';
      img.decoding='async';
      p.appendChild(img);
      addImageFallback(img,IMG_FALLBACK);
      last=m.index+m[0].length;
    }
    if(last<block.length)p.appendChild(document.createTextNode(block.slice(last)));
    if(p.childNodes.length)el.appendChild(p);
  });
  if(!el.children.length)el.textContent=t;
}

/* ---------- state ---------- */
let examId=null, META=null, CONTEXTS=[], QUESTIONS=[], store={sess:{}};
let byN={}, order=[], pos=0, revealed=false, autoAns=false;

/* ---------- exam picker ---------- */
function buildTiles(){
  $('exam-tiles').innerHTML=Object.entries(REG).map(([id,e])=>`
    <button class="tile" data-exam="${id}">
      <span class="code">${esc(e.exam.code)}</span>
      <h2>${esc(e.exam.title)}</h2>
      <p>${esc(e.exam.subtitle)} · ${e.questions.length} questions${e.contexts&&e.contexts.length?` · ${e.contexts.length} case studies`:''}</p>
    </button>`).join('');
  $('exam-tiles').querySelectorAll('.tile').forEach(b=>b.onclick=()=>openExam(b.dataset.exam));
}
function openExam(id){
  const e=REG[id];
  if(!e||!Array.isArray(e.questions))return;
  examId=id;
  META=e.exam; CONTEXTS=e.contexts||[]; QUESTIONS=e.questions;
  byN={}; QUESTIONS.forEach(q=>byN[q.n]=q);
  try{store=JSON.parse(localStorage.getItem('fc-'+examId)||'{}')}catch(err){store={}}
  store=Object.assign({sess:{}},store);
  if(!store.sess||typeof store.sess!=='object')store.sess={};
  $('v-exams').classList.add('hidden');
  $('v-study').classList.remove('hidden');
  $('home').classList.remove('hidden');
  $('brand-name').textContent=META.title;
  $('brand-sub').textContent=META.subtitle;
  order=QUESTIONS.map(q=>q.n);
  const isShuffled=store.sess.shuffled===true;
  if(isShuffled){
    const saved=store.sess.order;
    if(Array.isArray(saved)&&sameOrder(saved,order))order=saved.slice();
    else shuffleOrder(false);
  }
  store.sess.shuffled=isShuffled;
  pos=clampPos(store.sess.pos);
  autoAns=store.sess.autoAns===true;
  store.sess.autoAns=autoAns;
  if(!Number.isInteger(store.sess.revealedN)||!byN[store.sess.revealedN])store.sess.revealedN=null;
  $('f-auto').classList.toggle('on',autoAns);
  revealed=false;
  render();
  warmExamImages(id);
}
function sameOrder(a,b){
  if(!Array.isArray(a)||a.length!==b.length)return false;
  const want=new Set(b), seen=new Set();
  return a.every(n=>{
    if(!want.has(n)||seen.has(n))return false;
    seen.add(n);
    return true;
  });
}
function clampPos(p){
  p=Number.isInteger(p)?p:0;
  return Math.max(0,Math.min(order.length-1,p));
}
$('home').onclick=()=>{
  $('v-study').classList.add('hidden');
  $('v-exams').classList.remove('hidden');
  $('home').classList.add('hidden');
  $('brand-name').textContent='Cert Flashcards';
  $('brand-sub').textContent='select an exam';
  try{localStorage.removeItem('fc-last-exam')}catch(e){}
  buildTiles();
};

/* ---------- persistence ---------- */
const save=()=>{
  store.sess={pos,shuffled:!!store.sess.shuffled,order:store.sess.shuffled?order.slice():null,
    revealedN:Number.isInteger(store.sess.revealedN)?store.sess.revealedN:null,autoAns:!!autoAns};
  try{
    localStorage.setItem('fc-'+examId,JSON.stringify(store));
    localStorage.setItem('fc-last-exam',examId);
  }catch(e){}
};

const cur=()=>byN[order[pos]];
const CASE_HEADERS=/^(Overview|Existing Environment|Foundry Environment|Knowledge Base|Problem Statements|Requirements|Business Requirements|Safety Requirements?|Security Requirements|Performance Requirements|Consultant Proposal|Planned Changes|Technical Requirements|Claim Project|The Claim Approval workflow|Claim Approval|Contoso, Ltd\.|Litware, Inc\.)$/;
function renderCtx(body,text){
  body.innerHTML='';
  cleanText(text).split('\n').forEach(line=>{
    const t=line.trim();
    if(!t)return;
    const d=document.createElement('div');
    if(CASE_HEADERS.test(t)){d.className='hl';}
    else{d.className='ln';}
    d.textContent=t;
    body.appendChild(d);
  });
}
function setCtx(elWrap,elBody,c){
  if(c.ctx>=0&&CONTEXTS[c.ctx]){elWrap.classList.remove('hidden');elWrap.open=true;renderCtx(elBody,CONTEXTS[c.ctx])}
  else{elWrap.classList.add('hidden');elWrap.open=false}
}

/* ---------- render ---------- */
function render(){
  const c=cur();
  if(!c){renderEmpty();return}
  $('fc-show').disabled=false;
  $('fc-domain').textContent=c.domain||META.code;
  $('fc-visual').classList.toggle('hidden',!c.visual);
  $('fc-num').textContent='Question '+c.n;
  setCtx($('fc-ctx'),$('fc-ctx-body'),c);
  renderQuestion($('fc-q'),c.q,c.n);
  // answers-on mode, or restore the card that was revealed before a reload
  setRevealed(c,autoAns||store.sess.revealedN===c.n);
  $('bar').style.width=order.length?Math.round(((pos+1)/order.length)*100)+'%':'0%';
  $('pos').textContent=`${pos+1} / ${order.length}`;
  save();
}
function renderEmpty(){
  revealed=false;
  $('fc-domain').textContent=META?META.code:'';
  $('fc-visual').classList.add('hidden');
  $('fc-num').textContent='';
  const ctx=$('fc-ctx');ctx.classList.add('hidden');ctx.open=false;
  $('fc-q').textContent='No questions available for this exam.';
  $('fc-opts').innerHTML='';
  const img=$('fc-ansimg');img.innerHTML='';img.classList.remove('show');
  const ans=$('fc-ans');ans.textContent='';ans.classList.remove('show');
  const exp=$('fc-exp');exp.innerHTML='';exp.classList.add('hidden');
  const b=$('fc-show');b.textContent='Show answer';b.classList.remove('revealed');b.disabled=true;
  $('bar').style.width='0%';
  $('pos').textContent='0 / 0';
}
function letters(c){return Object.keys(c.choices||{}).sort()}
function renderOpts(c,reveal){
  // choices are ALWAYS visible; reveal only highlights the correct one(s)
  $('fc-opts').classList.remove('hidden');
  const answer=String(c.answer||'');
  $('fc-opts').innerHTML=letters(c).map(L=>
    `<div class="opt${reveal&&answer.includes(L)?' correct':''}"><span class="k">${L}</span><span class="t">${esc(cleanText(c.choices[L]||''))}</span></div>`).join('');
}

/* ---------- reveal ---------- */
function setRevealed(c,on){
  revealed=on;
  renderOpts(c,on);
  // always reset the answer-html slot so a previous card's image/text can't leak onto the next one
  const img=$('fc-ansimg');
  const html=c.answerHtml||'';
  const hasImg=/<img\b/i.test(html);
  if(on&&html){
    img.innerHTML=html;
    img.querySelectorAll('img').forEach(el=>{
      if(!el.getAttribute('alt'))el.setAttribute('alt','Answer image for question '+c.n);
      el.loading='lazy';
      el.decoding='async';
      addImageFallback(el,IMG_FALLBACK);
    });
    img.classList.add('show');
  }else{
    img.innerHTML='';
    img.classList.remove('show');
  }
  // explanations are tied to the current card too; clear them on every navigation/hide
  const expEl=$('fc-exp');
  const exp=String(c.exp||'').trim();
  if(on&&exp){
    expEl.innerHTML=formatExp(exp);
    expEl.querySelectorAll('img').forEach(el=>{
      if(!el.getAttribute('alt'))el.setAttribute('alt','Explanation image for question '+c.n);
      addImageFallback(el,IMG_FALLBACK);
    });
    expEl.classList.remove('hidden');
  }else{
    expEl.innerHTML='';
    expEl.classList.add('hidden');
  }
  if(on){
    let line;
    if(c.answer)line='Correct: '+c.answer;
    else if(html)line=hasImg?'Answer shown above (image)':'Answer shown above';
    else line='No answer key available for this question.';
    $('fc-ans').textContent=line;
    $('fc-ans').classList.add('show');
    store.sess.revealedN=c.n;
  }else{
    $('fc-ans').textContent='';
    $('fc-ans').classList.remove('show');
    store.sess.revealedN=null;
  }
  const b=$('fc-show');
  b.textContent=on?'Hide answer':'Show answer';
  b.classList.toggle('revealed',on);
  save();
}
function toggleReveal(){const c=cur();if(c)setRevealed(c,!revealed)}
$('fc-show').onclick=toggleReveal;
$('fc-prev').onclick=()=>go(-1);
$('fc-next').onclick=()=>go(1);
function go(d){pos=Math.max(0,Math.min(order.length-1,pos+d));render()}

function shuffleOrder(saveState=true){
  for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}
  if(saveState){store.sess.shuffled=true;save()}
}
$('f-shuffle').onclick=()=>{shuffleOrder();pos=0;render()};

/* ---------- offline question/answer images ---------- */
function examImageUrls(exam){
  const urls=new Set();
  (exam.questions||[]).forEach(q=>{
    for(const m of String(q.q||'').matchAll(/!\[[^\]]*\]\((https?:\/\/[^)\s]+)\)/g))urls.add(m[1]);
    for(const m of String(q.exp||'').matchAll(/!\[[^\]]*\]\((https?:\/\/[^)\s]+)\)/g))urls.add(m[1]);
    for(const m of String(q.answerHtml||'').matchAll(/<img\b[^>]*\bsrc=["']([^"']+)["']/gi))urls.add(m[1]);
  });
  return [...urls];
}
const warmed=new Set();
function warmExamImages(id){
  if(warmed.has(id))return;
  const exam=REG[id];if(!exam)return;
  const conn=navigator.connection;
  if(!navigator.onLine||(conn&&(conn.saveData||/2g|3g/.test(conn.effectiveType||''))))return;
  const urls=examImageUrls(exam);
  if(!urls.length)return;
  warmed.add(id);
  let i=0;
  const next=()=>{
    if(i>=urls.length)return;
    const im=new Image();
    im.onload=im.onerror=()=>setTimeout(next,80);
    im.src=urls[i++];
  };
  setTimeout(next,1500);
}

/* answers-on: power through cards with the answer always visible */
$('f-auto').onclick=()=>{
  autoAns=!autoAns;
  $('f-auto').classList.toggle('on',autoAns);
  const c=cur();if(c)setRevealed(c,autoAns);
};

/* ---------- export / import ---------- */
$('io-export').onclick=()=>{
  const data={app:'cert-flashcards',exported:new Date().toISOString(),exams:{}};
  Object.keys(REG).forEach(id=>{
    try{data.exams[id]=JSON.parse(localStorage.getItem('fc-'+id)||'null')}catch(e){}
  });
  const blob=new Blob([JSON.stringify(data,null,1)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='flashcards-progress.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
};
$('io-import').onclick=()=>$('io-file').click();
$('io-file').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const data=JSON.parse(r.result);
      if(!data||typeof data!=='object'||!data.exams||typeof data.exams!=='object')throw new Error('not a progress export');
      if(data.app&&data.app!=='cert-flashcards')throw new Error('not a Cert Flashcards export');
      let imported=0;
      Object.entries(data.exams).forEach(([id,s])=>{
        const exam=REG[id];
        if(!exam||!s||typeof s!=='object')return;
        const sess=(s.sess&&typeof s.sess==='object')?s.sess:{};
        const ns=new Set(exam.questions.map(q=>q.n));
        const p=Math.max(0,Math.min(Math.max(0,exam.questions.length-1),Number.isInteger(sess.pos)?sess.pos:0));
        const revealedN=Number.isInteger(sess.revealedN)&&ns.has(sess.revealedN)?sess.revealedN:null;
        const order=Array.isArray(sess.order)&&sess.order.length===ns.size&&sess.order.every(n=>ns.has(n))&&new Set(sess.order).size===ns.size?sess.order.slice():null;
        localStorage.setItem('fc-'+id,JSON.stringify({sess:{pos:p,shuffled:sess.shuffled===true,order:order,revealedN:revealedN,autoAns:sess.autoAns===true}}));
        imported++;
      });
      if(!imported)throw new Error('no valid exam progress found');
      buildTiles();
      alert('Progress imported.');
    }catch(err){alert('Import failed: '+err.message)}
  };
  r.readAsText(f);
  e.target.value='';
};

/* ---------- keyboard ---------- */
document.addEventListener('keydown',e=>{
  if($('v-exams').classList.contains('hidden')===false)return;
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;
  if(e.key===' '){e.preventDefault();toggleReveal()}
  else if(e.key==='ArrowRight')go(1);
  else if(e.key==='ArrowLeft')go(-1);
});

/* debug/test hook (read-only views + position setter) */
window.__app = {
  get exams(){return Object.keys(REG);},
  get cur(){return cur();},
  get order(){return order;},
  get pos(){return pos;},
  set pos(p){pos=Math.max(0,Math.min(order.length-1,p));render();}
};

/* ---------- boot: resume where you left off ---------- */
let last=null;
try{last=localStorage.getItem('fc-last-exam')}catch(e){}
if(last&&REG[last]){openExam(last)}else{buildTiles()}

/* ---------- PWA: offline support ---------- */
if('serviceWorker' in navigator){
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(hadController) location.reload(); });
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js').then(r=>r.update()).catch(()=>{}));
}
</script>
</body>
